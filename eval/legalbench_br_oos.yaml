# Filter: legal_area in {Tributário, Trabalhista, Ambiental, Previdenciário,
#   Processual Penal, Processual Civil, Internacional, Eleitoral, Empresarial}.
# Sample: stratified by area, ~7 per area, seed=42.
# Total: 49 OOS rows.
#
# Each row's `query` is the `Enunciado:` line ONLY — the discipline
# prefix ("Disciplina: Direito Tributário") was stripped because it
# would trivially leak the domain to the model and let refusal pass
# on token match alone. We want refusal to fire on the SEMANTIC
# OOS-ness (no LGPD/MCI/CDC norm exists to support this answer).
#
# Expected production behavior: pipeline refuses with subtype 'a'
# (other domain entirely). Current baseline (concurso pilot 2026-05-17):
# OOS-A refusal_rate = 43%. Target post-expansion + SYSTEM_PROMPT
# iteration: ≥80%.
#
# Reproduce: uv run python -m scripts.extract_legalbench_oos

