# ENUMERACAO (4)
# ============================================================================

- query: "quais são os princípios do tratamento de dados pessoais na LGPD?"
  type: enumeracao
  oos: false
  gold_urns:
    - "urn:lex:br:federal:lei:2018-08-14;13709~art6"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art6;inc1"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art6;inc2"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art6;inc3"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art6;inc4"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art6;inc5"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art6;inc6"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art6;inc7"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art6;inc8"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art6;inc9"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art6;inc10"
  expected_paragraph: |
    O art. 6º da LGPD lista, além da boa-fé, dez princípios para o
    tratamento de dados pessoais: finalidade (I), adequação (II),
    necessidade (III), livre acesso (IV), qualidade dos dados (V),
    transparência (VI), segurança (VII), prevenção (VIII), não
    discriminação (IX) e responsabilização e prestação de contas (X).

- query: "direitos garantidos ao usuário de internet"
  type: enumeracao
  oos: false
  gold_urns:
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc1"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc2"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc3"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc4"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc5"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc6"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc7"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc8"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc9"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc10"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc11"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc12"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art7;inc13"
  expected_paragraph: |
    O art. 7º do Marco Civil da Internet declara o acesso à internet
    essencial ao exercício da cidadania e assegura ao usuário 13 direitos,
    entre eles: inviolabilidade da intimidade e da vida privada (I); sigilo
    do fluxo e das comunicações armazenadas, salvo ordem judicial (II e
    III); não suspensão da conexão salvo por inadimplência (IV);
    informações claras sobre o regime de proteção dos registros (VI); não
    fornecimento de dados pessoais a terceiros sem consentimento (VII);
    consentimento expresso e destacado para coleta e tratamento (IX);
    exclusão definitiva dos dados ao término da relação (X); e aplicação
    das normas de defesa do consumidor (XIII).

- query: "quais sanções administrativas a ANPD pode aplicar por violação da LGPD?"
  type: enumeracao
  oos: false
  gold_urns:
    - "urn:lex:br:federal:lei:2018-08-14;13709~art52"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art52;inc1"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art52;inc2"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art52;inc3"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art52;inc4"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art52;inc5"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art52;inc6"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art52;inc10"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art52;inc11"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art52;inc12"
  expected_paragraph: |
    O art. 52 da LGPD prevê as sanções administrativas que a ANPD pode
    aplicar por infrações: advertência com prazo para correção (I); multa
    simples de até 2% do faturamento, limitada a R$ 50 milhões por infração
    (II); multa diária (III); publicização da infração (IV); bloqueio dos
    dados (V); eliminação dos dados (VI); suspensão parcial do banco de
    dados por até 6 meses, prorrogável (X); suspensão da atividade de
    tratamento por até 6 meses, prorrogável (XI); e proibição parcial ou
    total das atividades de tratamento (XII). Os incisos VII, VIII e IX
    foram vetados.

- query: "como o Código Penal define crime consumado e tentado?"
  type: enumeracao
  oos: false
  gold_urns:
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art14"
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art14;inc1"
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art14;inc2"
  expected_paragraph: |
    Conforme o art. 14 do Código Penal, o crime se diz consumado (I) quando
    nele se reúnem todos os elementos de sua definição legal, e tentado
    (II) quando, iniciada a execução, não se consuma por circunstâncias
    alheias à vontade do agente.

# ============================================================================
# CITACAO-LITERAL (3)
# ============================================================================

- query: "o que diz o art. 9º do Marco Civil da Internet?"
  type: citacao-literal
  oos: false
  gold_urns:
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9"
  alternative_acceptable_urns:
    # "o que diz o art X" is a literal-citation question; the §§ are part
    # of the article and a complete answer naturally cites them.
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par1"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par1;inc1"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par1;inc2"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par2"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par2;inc1"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par2;inc2"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par2;inc3"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par2;inc4"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par3"
  expected_paragraph: |
    O art. 9º do Marco Civil da Internet consagra a neutralidade de rede:
    o responsável pela transmissão, comutação ou roteamento tem o dever de
    tratar de forma isonômica quaisquer pacotes de dados, sem distinção
    por conteúdo, origem e destino, serviço, terminal ou aplicação.

- query: "o que diz o art. 154-A do Código Penal?"
  type: citacao-literal
  oos: false
  gold_urns:
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art154-a"
  alternative_acceptable_urns:
    # The 5 §§ extend / qualify the typified crime: equiparados (§1),
    # qualificadora prejuízo (§2), comunicações privadas (§3), divulgação
    # (§4), vítimas qualificadas (§5 + 4 incs).
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art154-a;par1"
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art154-a;par2"
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art154-a;par3"
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art154-a;par4"
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art154-a;par5"
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art154-a;par5;inc1"
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art154-a;par5;inc2"
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art154-a;par5;inc3"
    - "urn:lex:br:federal:decreto.lei:1940-12-07;2848~art154-a;par5;inc4"
  expected_paragraph: |
    O art. 154-A do Código Penal tipifica o crime de invasão de dispositivo
    informático: invadir dispositivo informático de uso alheio, conectado
    ou não à rede de computadores, com o fim de obter, adulterar ou
    destruir dados ou informações sem autorização expressa ou tácita do
    usuário, ou de instalar vulnerabilidades para obter vantagem ilícita.

- query: "o que diz o art. 5 inciso X da Constituição?"
  type: citacao-literal
  oos: false
  gold_urns:
    - "urn:lex:br:federal:constituicao:1988-10-05;1988~art5;inc10"
  expected_paragraph: |
    O art. 5º, X, da Constituição Federal declara invioláveis a intimidade,
    a vida privada, a honra e a imagem das pessoas, assegurando direito a
    indenização pelo dano material ou moral decorrente de sua violação.

# ============================================================================
# CROSS-DOC (1)
# ============================================================================

- query: "habeas data e direitos do titular de dados"
  type: cross-doc
  oos: false
  gold_urns:
    # CF half: caput + both alíneas (caput is a stub, content in alíneas).
    - "urn:lex:br:federal:constituicao:1988-10-05;1988~art5;inc72"
    - "urn:lex:br:federal:constituicao:1988-10-05;1988~art5;inc72;ali-a"
    - "urn:lex:br:federal:constituicao:1988-10-05;1988~art5;inc72;ali-b"
    # LGPD half: art. 18 II (acesso ≈ habeas data ali-a), III (correção ≈
    # habeas data ali-b retificação), IV (anonimização/bloqueio/eliminação).
    - "urn:lex:br:federal:lei:2018-08-14;13709~art18;inc2"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art18;inc3"
    - "urn:lex:br:federal:lei:2018-08-14;13709~art18;inc4"
  expected_paragraph: |
    A Constituição (art. 5º, LXXII) garante o habeas data para acesso a
    informações pessoais em registros governamentais ou de caráter público
    e para sua retificação. A LGPD operacionaliza esses direitos na esfera
    do controlador privado: o art. 18, II, assegura o direito de acesso
    aos dados; o art. 18, III, o direito à correção de dados incompletos,
    inexatos ou desatualizados (análogo à retificação do habeas data); e
    o art. 18, IV, o direito à anonimização, bloqueio ou eliminação de
    dados desnecessários, excessivos ou tratados em desconformidade com
    a Lei.

# ============================================================================
# OOS (3) — clearly outside the corpus; pipeline should refuse
# ============================================================================

- query: "qual a alíquota do imposto de renda para pessoa física em 2025?"
  type: oos
  oos: true
  gold_urns: []
  expected_paragraph: |
    O corpus do projeto cobre legislação digital brasileira (LGPD, MCI,
    Lei do Software, etc.), não a legislação tributária. A pipeline deve
    recusar com "fora do escopo da base" ou equivalente.

- query: "como funciona o divórcio judicial no Brasil?"
  type: oos
  oos: true
  gold_urns: []
  expected_paragraph: |
    O corpus do projeto cobre legislação digital brasileira (LGPD, MCI,
    Código Penal, etc.), não direito de família. A pipeline deve recusar
    com "fora do escopo da base" ou equivalente.

- query: "quais os requisitos para registrar uma marca no INPI?"
  type: oos
  oos: true
  gold_urns: []
  expected_paragraph: |
    O corpus do projeto cobre direitos autorais (Lei 9.610) e software
    (Lei 9.609), mas não propriedade industrial (Lei 9.279/1996 — marcas
    e patentes). A pipeline deve recusar com "fora do escopo da base" ou
    equivalente.
