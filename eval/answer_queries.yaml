# Answer-eval set v0 — 15 rows for Phase 2 LLM-pipeline measurement.
#
# Different from eval/queries.yaml (retrieval gold): here we also pin the
# *content* of an acceptable answer, so we can score faithfulness with an
# LLM judge (Phase 2.6) and citation precision/recall against the gold.
#
# Schema:
#   query                — the user-facing question
#   type                 — same taxonomy as eval/queries.yaml
#                          (definicao | enumeracao | citacao-literal | cross-doc | oos)
#   oos                  — true iff out-of-scope (no answer should be produced;
#                          the pipeline should refuse)
#   gold_urns                    — URNs the answer SHOULD cite. For
#                                  enumerações we list every relevant
#                                  chunk; the pipeline may miss some due
#                                  to top_k limits, which is exactly the
#                                  recall signal we want to measure.
#   alternative_acceptable_urns  — optional. URNs that AREN'T must-cite
#                                  but a senior lawyer would consider
#                                  naturally co-cited (e.g., the §§ that
#                                  carry exceptions to a rule's caput).
#                                  Used to compute lenient citation
#                                  precision: the diff lenient - strict
#                                  measures "over-citation that's still
#                                  defensible". Empty by default.
#   expected_paragraph           — a 1-5 sentence ground-truth paraphrase.
#                                  Not the chunk text verbatim — it's
#                                  what a senior lawyer would say when
#                                  prompted to summarize the rule. The
#                                  LLM judge compares the model's `answer`
#                                  to this for faithfulness scoring (0-5).
#
# Sample distribution:
#   - 4 definicao         (single-chunk gold, short answer)
#   - 4 enumeracao        (multi-chunk gold, longer answer)
#   - 3 citacao-literal   (article-number anchored)
#   - 1 cross-doc         (gold spans ≥2 laws)
#   - 3 oos               (clearly outside the corpus; should refuse)
#
# This v0 is small (15 rows). Documented as such in study/phase-2-design.md.
# Expand iteratively once metrics are flowing.

# ============================================================================
# DEFINICAO (4)
# ============================================================================

- query: "qual a definição de dado pessoal na LGPD?"
  type: definicao
  oos: false
  gold_urns:
    - "urn:lex:br:federal:lei:2018-08-14;13709~art5;inc1"
  expected_paragraph: |
    Segundo a LGPD (art. 5º, I), dado pessoal é toda informação relacionada
    a pessoa natural identificada ou identificável.

- query: "o que é neutralidade de rede no Marco Civil da Internet?"
  type: definicao
  oos: false
  gold_urns:
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9"
  alternative_acceptable_urns:
    # The §§ carry the exceções to neutralidade — a lawyer answering
    # "o que é neutralidade?" would naturally cite the rule + its limits.
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par1"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par1;inc1"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par1;inc2"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par2"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par2;inc1"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par2;inc2"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par2;inc3"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par2;inc4"
    - "urn:lex:br:federal:lei:2014-04-23;12965~art9;par3"
  expected_paragraph: |
    O Marco Civil da Internet (art. 9º) estabelece a neutralidade de rede
    como o dever do responsável pela transmissão, comutação ou roteamento
    de tratar de forma isonômica quaisquer pacotes de dados, sem distinção
    por conteúdo, origem e destino, serviço, terminal ou aplicação.

- query: "qual a definição legal de programa de computador no Brasil?"
  type: definicao
  oos: false
  gold_urns:
    - "urn:lex:br:federal:lei:1998-02-19;9609~art1"
  expected_paragraph: |
    A Lei do Software (Lei nº 9.609/1998, art. 1º) define programa de
    computador como a expressão de um conjunto organizado de instruções em
    linguagem natural ou codificada, contida em suporte físico de qualquer
    natureza, empregada em máquinas automáticas de tratamento da informação
    para fazê-las funcionar de modo e para fins determinados.

- query: "o que é habeas data?"
  type: definicao
  oos: false
  gold_urns:
    # CF art. 5 LXXII caput is a list-stem ("conceder-se-á habeas-data:").
    # The substantive content lives in the two alíneas — both must be cited
    # for the expected_paragraph to be reproducible from context.
    - "urn:lex:br:federal:constituicao:1988-10-05;1988~art5;inc72"
    - "urn:lex:br:federal:constituicao:1988-10-05;1988~art5;inc72;ali-a"
    - "urn:lex:br:federal:constituicao:1988-10-05;1988~art5;inc72;ali-b"
  expected_paragraph: |
    A Constituição (art. 5º, LXXII) prevê o habeas data como remédio
    constitucional para (a) assegurar o conhecimento de informações
    relativas à pessoa do impetrante constantes de registros ou bancos de
    dados de entidades governamentais ou de caráter público, e (b) para
    retificação desses dados quando não se prefira fazê-lo por processo
    sigiloso, judicial ou administrativo.

