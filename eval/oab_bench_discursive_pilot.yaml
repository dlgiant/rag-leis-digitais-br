- source_id: maritaca-ai/oab-bench/39_direito_civil_questao_3
  category: discursive
  legal_area: direito_civil
  max_score: 1.25
  query: 'QUESTÃO


    Maria cadastrou-se e adquiriu serviço de aprendizagem on-line de língua estrangeira
    na sociedade empresária Hello English Ltda., dando consentimento, informado nos
    termos de uso e autorização, para tratamento de seus dados pessoais. Após 1 (um)
    ano de curso, decidiu romper o vínculo, mas continuou recebendo muitas notificações
    indesejadas da sociedade empresária.

    Mesmo sem visualizar qualquer ilegalidade quanto ao tratamento de seus dados pessoais,
    formulou requerimento expresso via canal de comunicação da empresa para (i) retirar
    o consentimento no tratamento de dados; e (ii) eliminar os seus dados cadastrais
    em definitivo, para fins de publicidade e marketing.

    Em resposta, a sociedade empresária informou que não atenderia à solicitação porque
    a operadora dos dados (SuperData Ltda.) informou que os dados foram tratados dentro
    da lei, e que Maria não teria direito a pedir a eliminação dos dados para os fins
    desejados (evitar a publicidade e marketing), considerando que os dados não são
    sensíveis.

    Irritada, até porque continuou a receber material publicitário, Maria ajuizou
    ação judicial contra a sociedade empresária SuperData Ltda., e notificou a Autoridade
    Nacional de Proteção de Dados (ANPD) sobre a conduta adotada por ambas as empresas.

    A sociedade empresária ré (SuperData Ltda.) alega que sua responsabilidade é apenas
    tratar os dados, não sendo ela quem determina a exclusão dos dados, mas somente
    a controladora (Hello English Ltda.), razão pela qual não responde pelo pedido
    de Maria, pois nunca recebeu uma ordem da controladora para excluir os dados de
    Maria.

    Sobre a hipótese apresentada, responda aos itens a seguir'
  rubric: 'Sim. O Art. 8º, § 5º, da Lei nº 13.709/18 (LGPD) dispõe que “o consentimento
    pode ser revogado a qualquer momento mediante manifestação expressa do titular,
    por procedimento gratuito e facilitado, ratificados os tratamentos realizados
    sob amparo do consentimento anteriormente manifestado, enquanto não houver requerimento
    de eliminação”. Em razão disso, deve-se operar o término no tratamento de dados
    (Art. 15, inciso III, da LGPD), com a consequente eliminação dos dados cadastrais
    para os fins especificados (publicidade e marketing), na forma do Art. 16, caput,
    da LGPD.


    DISTRIBUIÇÃO DOS PONTOS


    | ITEM                                                                                                                                                                                                                               |
    PONTUAÇÃO      |

    |:-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|:---------------|

    | A1. Sim. O consentimento do titular pode ser revogado a qualquer momento mediante
    manifestação expressa do titular (0,30), na forma do Art. 8º, § 5º, da LGPD (0,10).                                                              |
    0,00/0,30/0,40 |

    | A2. Com a revogação do consentimento, opera-se o término do tratamento e a consequente
    eliminação dos dados pessoais (0,15), na forma do Art. 15, inciso III, OU do Art.
    16, ambos da LGPD (0,10).                                 | 0,00/0,15/0,25 |

    '
  notes: LGPD art.8 §5 + art.15 III — consent revocation + dados elimination. Direct
    hit on LGPD in our corpus.
