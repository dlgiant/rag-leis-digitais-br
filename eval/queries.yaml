# Eval set for embedding/retrieval comparison.
#
# Each entry:
#   query    — the search string
#   relevant — list of chunk URNs that should be retrieved (binary relevance)
#   notes    — optional, free text (which artigo, what the question is about)
#
# Tips when adding queries:
#   - Aim for variety: definitions, broad concepts, cross-document, literal citations.
#   - Use partition-level URNs (art5;inc1 not art5) for precision.
#   - List all chunks that genuinely answer the query — multiple is fine.
#   - Run `uv run python -m rag_leis.run_eval --model bge-m3 --show-misses` to
#     spot URNs you typoed or chunks you forgot to add.

- query: "qual a definição de dado pessoal na LGPD?"
  relevant:
    - "urn:lex:br:federal:lei:2018-08-14;13709~art5;inc1"
  notes: "LGPD art. 5º, I — definição literal"

