# Eval set v2 — typed queries with graded relevance.
#
# Schema:
#   query    — the search string
#   type     — one of: definicao, enumeracao, citacao-literal, parafrase, cross-doc
#                * definicao: "o que é X?" / "qual a definição de X?" — gold is usually a single
#                  inciso or caput that names X.
#                * enumeracao: "quais são as X?" — gold is caput + all relevant incs/alíneas.
#                * citacao-literal: mentions article number directly ("o que diz o art. 18?").
#                  Tests whether the embedder maps explicit citations to the same chunk family
#                  as content questions.
#                * parafrase: natural-language phrasing without the law's canonical vocabulary.
#                  Stresses semantic retrieval — sparse/BM25 typically underperforms here.
#                * cross-doc: the canonical answer lives in ≥2 laws (e.g. consent in both MCI and
#                  LGPD, or retention periods across MCI articles).
#   relevant — gold chunks. Two accepted forms:
#                * v1 (binary, back-compat): flat URN list. All treated as rel=2 (core).
#                * v2 (graded):
#                    relevant:
#                      core:        # rel=2 — the chunk(s) a domain expert would name as THE answer
#                        - urn:...
#                      supporting:  # rel=1 — relevant but auxiliary (caput when the rule is in
#                                   # a child, or sibling paragraphs that add context)
#                        - urn:...
#                  Only use supporting when there's a real precedence — if all chunks are equal
#                  parts of the answer, keep them all in core.
#   notes    — optional, free text.
#
# Tips:
#   - Use partition-level URNs (art5;inc1 not art5) for precision.
#   - Run `python -m rag_leis.run_eval --model bge-m3 --show-misses` to catch typoed gold URNs.
#   - Aim for balance: ~10 queries per type, ≥4 per Tier-1 law, mix gold granularity
#     (artigo / inciso / paragrafo / alinea).

