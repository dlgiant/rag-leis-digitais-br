# ============================================================================
# OOS-B — adjacent without coverage. Topic touches our corpus' adjacency
# (internet / minor / advocacia) but norma específica não-indexada (ECA,
# Código de Ética OAB). Pipeline must refuse with subtype "b" — these are
# the trickier OOS cases where the model might be tempted to over-answer.
# ============================================================================

- source_id: "eduagarcia/oab_exams/2016-19_44"
  category: oos_b
  expected_oos_subtype: b
  question_type: parafrase
  query: "Adolescente de 16 anos foi induzido por adulto a prática de infração penal via internet. Configura crime nos termos do ECA?"
  notes: "Tópico tangencia internet (no corpus) mas norma operativa é ECA art.244-B (NÃO indexado). Adjacent-without-coverage. Pipeline correct path: recusar subtype b."

