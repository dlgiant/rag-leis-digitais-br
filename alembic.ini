# Phase 11.2.1 — Alembic config.
#
# Migrations live in `migrations/`. The DATABASE_URL is read at
# runtime from the environment in `migrations/env.py` — not from
# this file — so we never commit a connection string.
#
# `alembic upgrade head` is invoked from the FastAPI lifespan on
# app startup (when DATABASE_URL is set) AND from a one-shot
# script for the initial JSONL → Postgres data import.

[alembic]
script_location = migrations
prepend_sys_path = .
# URL is overridden at runtime from env; this is just a non-empty
# placeholder so alembic doesn't error on missing config.
sqlalchemy.url = driver://user:pass@localhost/db

# Single timeline: no branches needed for this project.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
