# Vigência overlays — v1 (Phase 16.2, 2026-05-22)
#
# Reviewer round 2 (legal-domain) flagged that `is_revoked_text` only
# catches Planalto markers `(Revogado)`/`(Vetado)`/`(Suprimido)`. It misses
# the legally-load-bearing categories: revogação tácita, suspensão,
# sub judice, vacatio legis parcial, eficácia limitada por regulamentação.
# Without these, the RAG commits the parecerista's worst error: treating
# formally-vigente text as applicable while ignoring active controversy.
#
# Phase 16.2 added `alterado_por_jurisprudencia` (distinct from `sub_judice`:
# a tese has been *fixed*, not is pending) + `proxima_revisao` field for
# quarterly audit cadence. Reason: round-3 review found MCI art. 19/21
# still flagged `sub_judice` referencing Tema 987 — but STF fixed the tese
# on 2024-06-26. An overlay without a review date silently rots; this
# closes the loop.
#
# Schema:
#   urn               — must resolve in the corpus (validated at load time)
#   status            — one of:
#                         vigente                      (default; not overlaid here)
#                         sub_judice                   (controvérsia constitucional pendente)
#                         suspenso                     (eficácia suspensa por liminar)
#                         vacatio_legis                (promulgado mas ainda não em vigor)
#                         eficacia_limitada            (depende de regulamentação infralegal)
#                         revogado_tacito              (incompatível com norma posterior)
#                         alterado_por_ec              (constitucional, EC modificadora — informativo)
#                         alterado_por_jurisprudencia  (STF/STJ fixou tese que altera aplicação)
#                         atualizado_recentemente      (lei alteradora recente; informativo)
#   fundamento        — processo (STF/STJ), ato normativo, ou EC
#   desde             — data ISO (afetação, edição, julgamento, etc.)
#   descricao_curta   — 1-3 frases que vão para o warning no answer
#   proxima_revisao   — data ISO (operador) — quando re-auditar este overlay
#
# v1 cobre 13 dispositivos. Lista expande conforme novos casos surgirem
# (ANPD jurisprudência STF/STJ em Phase 6 Tier-4). Quarterly cadence:
# `proxima_revisao` defaults para +90 dias da última edição da entrada.

# ============================================================================
# alterado_por_jurisprudencia — STF/STJ fixou tese que altera aplicação
# ============================================================================
#
# Phase 16.2 (2026-05-22): MCI art. 19 + art. 21 movidos de `sub_judice`
# para `alterado_por_jurisprudencia`. STF concluiu o julgamento do Tema
# 987 em 2024-06-26 e fixou tese declarando inconstitucionalidade parcial
# do art. 19. O regime aplicável hoje é o estabelecido pela tese, não a
# literalidade do artigo. Transcrição verbatim do acórdão gated no D7
# lawyer review (Phase 19.1).

- urn: urn:lex:br:federal:lei:2014-04-23;12965~art19
  status: alterado_por_jurisprudencia
  fundamento: STF RE 1.037.396 (Tema 987) — julgado em 2024-06-26
  desde: 2024-06-26  # data do julgamento do Tema 987
  descricao_curta: |
    O STF julgou o Tema 987 da repercussão geral em 26/06/2024 e fixou
    tese declarando inconstitucionalidade parcial do art. 19. O regime
    aplicável hoje é o estabelecido pela tese, não a literalidade do
    artigo. Consultar o acórdão publicado para a redação verbatim antes
    de aplicar — transcrição verbatim pendente (Phase 19.1 / D7).
  proxima_revisao: 2026-08-22

- urn: urn:lex:br:federal:lei:2014-04-23;12965~art21
  status: alterado_por_jurisprudencia
  fundamento: STF RE 1.037.396 (Tema 987) — julgado em 2024-06-26
  desde: 2024-06-26
  descricao_curta: |
    Conexo ao Tema 987. Verificar na tese fixada em 26/06/2024 se o
    julgamento alcança o art. 21 (regime de remoção de imagens íntimas
    independentemente de ordem judicial) ou se este voltou a aplicação
    plena. Transcrição verbatim do acórdão pendente (Phase 19.1 / D7).
  proxima_revisao: 2026-08-22

