# ============================================================================
# vacatio_legis — informativo histórico (já vigente, mas relevante para
# casos antigos e para entender a entrada escalonada)
# ============================================================================

- urn: urn:lex:br:federal:lei:2018-08-14;13709~art65
  status: vacatio_legis
  fundamento: Lei 14.010/2020 (RJET) postergou as sanções
  desde: 2020-08-01
  descricao_curta: |
    Vigência escalonada da LGPD: arts. 52, 53 e 54 (sanções) entraram
    em vigor em 1º de agosto de 2021 (Lei 14.010/2020 art. 20). Demais
    dispositivos vigoraram em 18 de setembro de 2020. Hoje toda a Lei
    está vigente; este overlay serve apenas para datar fatos pretéritos.

# ============================================================================
# alterado_por_ec — origem constitucional via EC (informativo)
# ============================================================================

- urn: urn:lex:br:federal:constituicao:1988-10-05;1988~art5;inc79
  status: alterado_por_ec
  fundamento: Emenda Constitucional 115/2022
  desde: 2022-02-10
  descricao_curta: |
    Inciso LXXIX inserido pela EC 115/2022, elevando a proteção de dados
    pessoais (inclusive nos meios digitais) à categoria de direito
    fundamental. Antes da EC, a proteção decorria de leitura combinada
    do art. 5º, X, e da LGPD (Lei 13.709/2018).

