name: Weekly corpus refresh

# Phase 7.3 — runs the orchestrator (scripts/refresh_corpus.py) on schedule.
# On detected changes that pass all gates, opens a PR with the updated
# metadata + audit files for human review. On failure, opens an issue.
#
# Cost: ~$0 on no-diff weeks (most of them); ~$0.50 Voyage re-embed when
# something genuinely changed in the Planalto HTML.

on:
  schedule:
    # Sundays 02:00 UTC = 23:00 BRT (Saturday night). Quiet hours; runner
    # availability is best Sunday early morning.
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Manual trigger button — for ad-hoc refreshes ("did the gate work?")
    # without waiting for the weekly cron.

permissions:
  contents: write       # commit the metadata diff to a branch
  pull-requests: write  # open the auto-PR
  issues: write         # open failure issue if the orchestrator exits 1

concurrency:
  # Only one refresh at a time; canceling a stale run is fine.
  group: corpus-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # full cycle takes <10 min; 30 is the cap

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need history so PR branch base is correct

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: uv sync --extra voyage

      - name: Run refresh orchestrator
        id: refresh
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          set +e
          uv run python -m scripts.refresh_corpus 2>&1 | tee refresh.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Detect committed file changes
        id: detect
        run: |
          # Only data/metadata/* and data/audit/{last_eval_metrics.json,
          # corpus_updates.jsonl} are tracked. If those changed, there's
          # something to commit. Otherwise: no-op week.
          if git diff --quiet --exit-code data/metadata data/audit; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on failure
        if: steps.refresh.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Capture the last 60 lines for the issue body (enough for the
          # error context without dumping the full log).
          tail -n 60 refresh.log > tail.log

          body=$(cat <<EOF
          The weekly corpus refresh failed with exit code ${{ steps.refresh.outputs.exit_code }}.

          ## Workflow run
          - $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          ## Last 60 lines of refresh.log
          \`\`\`
          $(cat tail.log)
          \`\`\`

          ## Next steps
          1. Read the log above — usual culprits: Planalto HTML structure change (parser regression), Voyage API outage, eval threshold tripped (legitimate degradation or false alarm).
          2. Run \`uv run python -m scripts.refresh_corpus\` locally to reproduce.
          3. If parser regression: see \`study/phase-7-production-infra-plan.md\` §Riscos.
          4. If eval threshold tripped legitimately (e.g., dropped > 0.02 nDCG@10): inspect \`data/audit/last_eval_metrics.json\` baseline + the new metrics in the log; decide accept (delete baseline file to force re-seed) vs revert (parser/corpus bug).
          5. Close this issue once resolved.
          EOF
          )

          gh issue create \
            --title "Corpus refresh FAILED — $(date -u +%Y-%m-%d)" \
            --label "corpus-update-failed" \
            --body "$body"

      - name: Commit + open PR on changes
        if: steps.refresh.outputs.exit_code == '0' && steps.detect.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y-%m-%d)
          branch="corpus-refresh/${today}-$(date -u +%H%M)"

          # Git identity for the bot commit — must be set for GitHub
          # Actions to author commits.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add data/metadata data/audit
          git commit -m "Corpus refresh — ${today}

          Auto-generated by .github/workflows/refresh-corpus.yml weekly cron.
          See PR body for diff summary, eval delta, and reviewer checklist."

          git push -u origin "$branch"

          # PR body: pull the diff summary from refresh.log so the
          # reviewer sees what changed without reading the entire log.
          summary=$(awk '/^Diff summary/,/^Appended/' refresh.log | head -n 40)
          metrics=$(grep -E "^(  nDCG|  Recall|  MRR)" refresh.log | head -n 6)
          gate=$(grep -E "^\[refresh_corpus\] (baseline|EXIT)" refresh.log | tail -n 3)

          body=$(cat <<EOF
          Weekly corpus refresh detected changes in upstream Planalto HTML.

          ## Diff summary
          \`\`\`
          ${summary}
          \`\`\`

          ## Eval after re-embed
          \`\`\`
          ${metrics}
          \`\`\`

          ## Gate decision
          \`\`\`
          ${gate}
          \`\`\`

          ## Reviewer checklist
          See [docs/runbook-corpus-refresh.md](../blob/main/docs/runbook-corpus-refresh.md). Quick version:
          - [ ] Diff summary looks reasonable (no surprise URN, no surprise byte delta > 10× typical)
          - [ ] Eval metrics didn't regress beyond noise (nDCG@10 within 0.02 of baseline; smaller fluctuations expected)
          - [ ] No urgent flags from \`data/audit/corpus_updates.jsonl\` (e.g., 17/17 CHANGED indicates upstream structural change worth investigating before merging)
          - [ ] If accepting: merge this PR. The merge triggers the \`smoke-test.yml\` workflow which exercises a 10-query Sabiá pass.
          - [ ] If rejecting: close without merging; the metadata stays at the prior SHA. Investigate via local re-run.

          ## Workflow run
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          )

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Corpus refresh — ${today}" \
            --label "corpus-update" \
            --body "$body"

      - name: No-op summary
        if: steps.refresh.outputs.exit_code == '0' && steps.detect.outputs.has_changes == 'false'
        run: |
          echo "::notice::Refresh completed with no diff; nothing to PR."
