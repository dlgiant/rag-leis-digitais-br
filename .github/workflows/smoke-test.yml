name: Smoke test (manual)

# Phase 7.5 — verifies the production pipeline end-to-end:
# pytest (post fetch+parse) → 10 canonical queries via Sabiá generator.
#
# Trigger: workflow_dispatch ONLY (manual button in Actions tab).
# Auto-trigger on push was tried and removed because:
#   - Most pytest tests require local corpus (raw HTMLs + parsed chunks)
#     which are gitignored. Without fetch+parse setup steps, pytest fails
#     in CI even on a clean main.
#   - Doing fetch+parse+Voyage embed + Sabiá on every push to main costs
#     ~$0.55/push, which compounds quickly in active development.
#
# Cost: ~$0.55 per manual invocation (one fetch + one Voyage re-embed +
# 10 Sabiá calls). Operator triggers from the Actions tab after merging
# a refresh-corpus PR or when investigating a suspected regression.
#
# See docs/runbook-corpus-refresh.md Cenário 3 for triage guidance.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # open issue on smoke failure

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        # Voyage needed for any retrieval that hits the cached index.
        # `bge` not needed for smoke (the cached voyage index is the
        # production path).
        run: uv sync --extra voyage

      - name: Fetch corpus (Planalto HTML)
        # Pull raw HTMLs onto the ephemeral runner so subsequent steps
        # (parse, pytest, run_eval, smoke) can find them. Doesn't update
        # tracked metadata jsons (orchestrator does that on the weekly cron).
        run: uv run python -m rag_leis.fetch_tier --tier all

      - name: Parse corpus
        run: |
          uv run python -m rag_leis.parse_all_tier --tier 1
          uv run python -m rag_leis.parse_all_tier --tier 2
          uv run python -m scripts.filter_cc_personalidade

      - name: Run pytest (no network, skip ANPD-PDF tests)
        # ANPD PDFs (tier-3 sources) are not in git nor fetched by
        # fetch_tier — those tests need a manual download per
        # study/corpus-tier-3-anpd.md. Network tests skip via @skipif
        # when the relevant keys aren't set.
        run: uv run pytest -m "not network and not requires_anpd_pdf"

      - name: Build Voyage index (re-embed if cache stale)
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          uv run python -m rag_leis.run_eval --model voyage-3-large \
              --text-mode title+label+nav+caput+text

      - name: Sabiá smoke test
        # 10 canonical queries through the full Voyage + Sabiá pipeline.
        # Failures: crash / empty answer / unexpected refusal / no citations.
        # Not a metric gate — that's the weekly refresh's job.
        id: smoke
        env:
          MARITACA_API_KEY: ${{ secrets.MARITACA_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          set +e
          uv run python -m scripts.smoke_test_rag 2>&1 | tee smoke.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open issue on smoke failure
        if: steps.smoke.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 80 smoke.log > tail.log
          body=$(cat <<EOF
          The post-merge smoke test failed after commit ${{ github.sha }}.

          ## Workflow run
          - $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          ## Last 80 lines of smoke.log
          \`\`\`
          $(cat tail.log)
          \`\`\`

          ## Next steps
          1. Open the workflow run above. The failure is one of:
             - Crash (likely parser/pipeline regression; check stack trace)
             - Empty/refused answer on a query that should be in-scope (LLM behavior shift)
             - Voyage / Sabiá API outage (transient — re-run)
          2. If a code change introduced the regression, revert or fix-forward.
          3. If Sabiá refused something legitimate, the SYSTEM_PROMPT may need an iteration — see \`study/llm-provider-decision-2026-05-15.md\`.
          4. Close once resolved.
          EOF
          )
          gh issue create \
            --title "Post-merge smoke FAILED — $(git rev-parse --short HEAD)" \
            --label "production-degradation" \
            --body "$body"
