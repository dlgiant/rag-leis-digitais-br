[project]
name = "rag-leis-digitais-br"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=2.36.0",
    "pdfplumber>=0.11.9",
]

[project.optional-dependencies]
bge = ["FlagEmbedding>=1.3"]
voyage = ["voyageai>=0.3"]
reranker = ["FlagEmbedding>=1.3"]
# `datasets` is for the OAB/concurso eval pilot only — not load-bearing
# for production retrieval. Installed via `uv sync --extra concurso` when
# extending the eval set against eduagarcia/oab_exams etc.
concurso = ["datasets>=4.0"]
# Phase 8.1 — HTTP harness. FastAPI + uvicorn for serving the pipeline
# behind a `POST /v1/ask` endpoint. Installed via `uv sync --extra server`.
# Kept optional so the eval-only CLI surface doesn't pull a web stack.
server = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=8.0",
    "ruff>=0.15.12",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_configs = true
pretty = true

[[tool.mypy.overrides]]
module = ["FlagEmbedding.*", "voyageai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -p no:launch -p no:launch_ros -p no:launch_testing"
markers = [
    "network: hits external services (skipped unless explicitly selected with `-m network`).",
    "requires_anpd_pdf: needs ANPD source PDFs under data/raw/tier-3 (not in git; skipped in CI; tier-3 chunks are also derived state).",
]
