[project]
name = "rag-leis-digitais-br"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=2.36.0",
    "pdfplumber>=0.11.9",
]

[project.optional-dependencies]
bge = ["FlagEmbedding>=1.3"]
voyage = ["voyageai>=0.3"]
reranker = ["FlagEmbedding>=1.3"]
# `datasets` is for the OAB/concurso eval pilot only — not load-bearing
# for production retrieval. Installed via `uv sync --extra concurso` when
# extending the eval set against eduagarcia/oab_exams etc.
concurso = ["datasets>=4.0"]
# Phase 8.1 — HTTP harness. FastAPI + uvicorn for serving the pipeline
# behind a `POST /v1/ask` endpoint. Installed via `uv sync --extra server`.
# Kept optional so the eval-only CLI surface doesn't pull a web stack.
# Phase 8.2 — adds `slowapi` for per-API-key token-bucket rate limiting.
# Phase 8.3 — adds `structlog` for JSON logs + OpenTelemetry for tracing.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "slowapi>=0.1.9",
    "structlog>=24.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # Phase 11.0 — Clerk JWT verification for the admin endpoints
    # (`/v1/admin/*`). `pyjwt[crypto]` pulls in the `cryptography`
    # package for RSA signature verification. Networkless mode: we
    # use Clerk's published PEM public key (CLERK_JWT_KEY env var)
    # rather than fetching JWKS at runtime.
    "pyjwt[crypto]>=2.10",
    # Phase 11.2.1 — Postgres-backed storage for proposals + PII
    # audit log (replaces JSONL on Fly's ephemeral disk). psycopg
    # v3 (the modern driver) + psycopg_pool for connection pooling
    # under FastAPI's concurrent request load. Alembic manages
    # schema migrations (run by the app's lifespan on startup).
    # Neon-hosted Postgres in BR region (`sa-east-1` São Paulo).
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=8.0",
    "ruff>=0.15.12",
    "types-PyYAML>=6.0",
    # Phase 11.4 — ruamel.yaml for round-tripping eval/queries.yaml in
    # the operator's merge tool (`scripts/phase_11_4_merge_proposals.py`).
    # Preserves comments, ordering, and quoting style across writes —
    # PyYAML would destroy the schema comment at the top of the file.
    # Lives in dev-deps because the merge tool is operator-only; never
    # runs on Fly.
    "ruamel.yaml>=0.18",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles this
    # RUF001/002/003 — "ambiguous Unicode characters". The codebase deals
    # extensively with Portuguese legal text + math notation (e.g.,
    # `TIER_1∪TIER_2`, `ª`, `º`, accented quotes). These are not
    # confusables in our context. Ignored globally.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# scripts/ often does `PYTHONPATH=.` style invocations + sets paths or
# loads env BEFORE the imports, so E402 (module-level import not at top)
# fires legitimately. Allow it here only.
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_configs = true
pretty = true

[[tool.mypy.overrides]]
module = ["FlagEmbedding.*", "voyageai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -p no:launch -p no:launch_ros -p no:launch_testing"
markers = [
    "network: hits external services (skipped unless explicitly selected with `-m network`).",
    "requires_anpd_pdf: needs ANPD source PDFs under data/raw/tier-3 (not in git; skipped in CI; tier-3 chunks are also derived state).",
    "requires_local_data: needs files not in git — raw HTML under data/raw/ OR built chunks under data/chunks/tier-{1,2,3}/. Local devs have these; CI doesn't (data/raw + data/chunks/* gitignored). Skip in CI.",
]
